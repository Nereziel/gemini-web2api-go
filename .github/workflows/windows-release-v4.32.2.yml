name: Windows Server release v4.32.2 (English)

on:
  push:
    branches: [main]
    paths:
      - internal/app/server.go
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-v4.32.2
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify version
        run: grep -qx 'const Version = "4.32.2"' internal/app/server.go
      - name: Test
        run: go test ./...
      - name: Compile Windows x64
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/gemini-web2api-go_v4.32.2_windows_amd64.exe .
          cd dist
          sha256sum gemini-web2api-go_v4.32.2_windows_amd64.exe > SHA256SUMS.txt
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.32.2
          target_commitish: ${{ github.sha }}
          name: v4.32.2 — English admin panel and server logs
          body: |
            Windows Server x64 executable.
            Admin panel defaults to English on first visit. Runtime settings,
            diagnostics and operational logs are translated into English.
            Existing explicit language preference remains respected.
            Includes the OpenAI-compatible Images API added in v4.32.1.
          files: |
            dist/gemini-web2api-go_v4.32.2_windows_amd64.exe
            dist/SHA256SUMS.txt
